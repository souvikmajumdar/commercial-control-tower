name: Deploy to IBM Cloud Code Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent runs on the same branch - the second run waits until
# the first finishes so CE revisions are applied in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # IBM Cloud region and registry
  IBM_REGION: us-south
  ICR_HOST: us.icr.io

  # Non-sensitive configuration values (moved out of GitHub secrets for visibility)
  RG_NAME: marriott-poc
  ICR_NAMESPACE: marriott-poc
  CE_PROJECT: marriott-poc
  CE_SUBDOMAIN: 2cz4z9e2j76q
  BACKEND_APP_NAME: control-tower-backend
  FRONTEND_APP_NAME: control-tower-frontend

  # Backend URL used as the nginx proxy_pass target in the frontend image.
  # NOTE: this must NOT be passed through $GITHUB_OUTPUT - GHA silently blanks
  # any output variable whose value matches a GitHub secret (Issue #17).
  # Reference this env var directly wherever the URL is needed.
  BACKEND_CE_URL: https://control-tower-backend.2cz4z9e2j76q.us-south.codeengine.appdomain.cloud

  # Image names in ICR
  BACKEND_IMAGE: control-tower-backend
  FRONTEND_IMAGE: control-tower-frontend

jobs:
  # ── Backend: build, push, deploy ────────────────────────────────────────────
  backend:
    name: Backend - build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install IBM Cloud CLI and plugins
        uses: IBM/actions-ibmcloud-cli@v1
        with:
          version: latest
          plugins: container-registry,code-engine

      - name: Log in to IBM Cloud
        run: |
          ibmcloud login \
            --apikey "${{ secrets.IBMCLOUD_API_KEY }}" \
            -r "$IBM_REGION"
          ibmcloud target -g "$RG_NAME"
          ibmcloud cr region-set "$IBM_REGION"
          ibmcloud cr login

      # docker/login-action writes ICR credentials into the host Docker config.
      # ibmcloud cr login is kept above for the CE CLI steps; this step gives
      # the host daemon (and therefore the docker driver below) its own token.
      - name: Log in to ICR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ICR_HOST }}
          username: iamapikey
          password: ${{ secrets.IBMCLOUD_API_KEY }}

      # Use the host Docker daemon driver instead of docker-container.
      # The docker-container driver isolates BuildKit in its own container and
      # loses credentials mid-push on ICR with IAM enforcement (moby/buildkit#4111).
      # The docker driver runs in-process with the host daemon and shares its
      # credential store for the full push lifecycle.
      # Trade-off: type=gha layer cache is not supported by the docker driver;
      # cache steps are removed. Re-add cache using a registry backend if needed.
      - name: Set up Docker Buildx (docker driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.ICR_HOST }}/${{ env.ICR_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            REQUIREMENTS_FILE=requirements-ce.txt

      - name: Deploy backend to Code Engine
        run: |
          ibmcloud ce project select --name "$CE_PROJECT"

          # OPENAI_API_KEY is intentionally omitted here.
          # It is an application secret, not a CI/CD secret, and must be set
          # directly on the CE application via the IBM Cloud console or CLI:
          #   ibmcloud ce application update --name control-tower-backend \
          #     --env OPENAI_API_KEY=<value>
          # Without it, the Copilot feature degrades gracefully (fallback mode)
          # but all other functionality is unaffected.
          ibmcloud ce application update \
            --name "$BACKEND_APP_NAME" \
            --image "$ICR_HOST/$ICR_NAMESPACE/$BACKEND_IMAGE:latest" \
            --registry-secret icr-secret \
            --env DATABASE_URL=sqlite+aiosqlite:///./hotel_control_tower.db \
            --env FORECAST_PROVIDER=baseline \
            --env TIMESFM_ENABLED=false \
            --env COPILOT_ENABLED=true \
            --env OPENAI_MODEL=gpt-4o-mini \
            --env ALLOWED_ORIGINS="https://control-tower-frontend.$CE_SUBDOMAIN.us-south.codeengine.appdomain.cloud,http://localhost:5173" \
            --wait \
            --wait-timeout 600

      - name: Health-check backend (retry loop)
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_CE_URL/api/v1/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy."
              break
            fi
            if [ "$i" = "10" ]; then
              echo "Backend health check failed after 10 attempts."
              exit 1
            fi
            sleep 5
          done

  # ── Frontend: build, push, deploy ───────────────────────────────────────────
  frontend:
    name: Frontend - build & deploy
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install IBM Cloud CLI and plugins
        uses: IBM/actions-ibmcloud-cli@v1
        with:
          version: latest
          plugins: container-registry,code-engine

      - name: Log in to IBM Cloud
        run: |
          ibmcloud login \
            --apikey "${{ secrets.IBMCLOUD_API_KEY }}" \
            -r "$IBM_REGION"
          ibmcloud target -g "$RG_NAME"
          ibmcloud cr region-set "$IBM_REGION"
          ibmcloud cr login

      # Same docker driver fix as backend job.
      - name: Log in to ICR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ICR_HOST }}
          username: iamapikey
          password: ${{ secrets.IBMCLOUD_API_KEY }}

      - name: Set up Docker Buildx (docker driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # NGINX_BACKEND_URL is read from the env: block, NOT from a job output.
      # Passing a secret through $GITHUB_OUTPUT causes GHA to silently blank the
      # value (Issue #17). Reading it directly from env: avoids this entirely.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.ce
          push: true
          provenance: false
          tags: ${{ env.ICR_HOST }}/${{ env.ICR_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NGINX_BACKEND_URL=${{ env.BACKEND_CE_URL }}

      - name: Deploy frontend to Code Engine
        run: |
          ibmcloud ce project select --name "$CE_PROJECT"

          ibmcloud ce application update \
            --name "$FRONTEND_APP_NAME" \
            --image "$ICR_HOST/$ICR_NAMESPACE/$FRONTEND_IMAGE:latest" \
            --registry-secret icr-secret \
            --wait \
            --wait-timeout 600

      - name: Health-check frontend (retry loop)
        run: |
          FRONTEND_URL="https://$FRONTEND_APP_NAME.$CE_SUBDOMAIN.us-south.codeengine.appdomain.cloud"
          echo "Frontend URL: $FRONTEND_URL"
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL/" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is healthy."
              echo ""
              echo "Deploy complete."
              echo "  Backend:  $BACKEND_CE_URL"
              echo "  Frontend: $FRONTEND_URL"
              break
            fi
            if [ "$i" = "10" ]; then
              echo "Frontend health check failed after 10 attempts."
              exit 1
            fi
            sleep 5
          done
